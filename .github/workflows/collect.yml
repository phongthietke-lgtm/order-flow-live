# Bộ gom sau phiên (giai đoạn −1 của order-flow-live): lưu tick thô + nến 5' vào kho riêng để có ≥ 20 phiên trước
# khi dựng máy chủ trong phiên. 08:10 UTC = 15:10 VN; bù 15:30, 17:00, 20:00 VN nếu GitHub trễ/bỏ lượt.
# Gom trong ngày, KHÔNG dựa lượt sáng hôm sau: 07:22 sáng 30/09/2026 nguồn VNDirect đã trả rỗng.
# Không trùng giờ 15:50 (price-path zone) và 16:00 (order-flow) để ba repo không cùng dồn VNDirect.
name: collect

on:
  schedule:
    - cron: "10 8 * * 1-5"
    - cron: "30 8 * * 1-5"
    - cron: "0 10 * * 1-5"
    - cron: "0 13 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "Gom lại cả mã đã có phiên (ghi đè)"
        default: "false"

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install httpx==0.28.1

      # Bài học price-path 23/09/2026: job trả 1 để BÁO "có mã lỗi" nhưng đã ghi xong dữ liệu. Thiếu
      # continue-on-error + commit if: always() thì một mã lỗi làm mất trắng dữ liệu của các mã còn lại.
      - name: Gom tick
        id: collect
        continue-on-error: true
        run: |
          ARGS=
          if [ "${{ github.event.inputs.force }}" = "true" ]; then ARGS="--force"; fi
          python -m job.collect $ARGS

      # Chỉ commit khi kho có phiên mới; state.json/watchlist.json (có giờ chạy) đi kèm chứ không tự đẻ commit ở lượt dự phòng.
      - name: Commit kết quả
        if: always()
        run: |
          git config user.name "order-flow-live-bot"
          git config user.email "order-flow-live-bot@users.noreply.github.com"
          mkdir -p data/ticks data/store   # lượt đầu mà mọi mã lỗi thì chưa có thư mục → git add báo pathspec
          git add -A data/ticks data/store
          if git diff --cached --quiet; then echo "không có gì mới"; exit 0; fi
          git add data/state.json data/watchlist.json   # cả hai có giờ chạy → chỉ đi kèm phiên mới
          git commit -m "data: $(date -u +%Y-%m-%d) [skip ci]"
          git pull --rebase
          git push

      # Commit xong RỒI mới báo đỏ. continue-on-error làm failure() không còn đúng → xét outcome của step đó.
      - name: Báo đỏ nếu có mã lỗi
        if: steps.collect.outcome == 'failure'
        run: |
          echo "::error::Có mã lỗi — xem log bước Gom tick"
          exit 1
