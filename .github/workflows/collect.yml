# Bộ gom sau phiên (giai đoạn −1 của order-flow-live): lệnh khớp gốc của TOÀN BỘ cổ phiếu HOSE + HNX (≈700 mã, không UPCOM)
# để có lịch sử trước khi dựng máy chủ trong phiên. 08:10 UTC = 15:10 VN; bù 15:30, 17:00, 20:00 VN — lượt bù chỉ
# gom mã còn thiếu/lỗi (đọc data/days/<ngày>.json).
# Gom trong ngày: 07:22 sáng 30/09/2026 nguồn VNDirect đã trả rỗng. Ngày phiên lấy TỪ NGUỒN (job.collect.session_day)
# vì cron chạy trễ có thể qua nửa đêm; lượt bù tự tải gói Release của ngày đó (download_tar).
# Tick thô (vài MB/ngày) để ở GitHub Release tag t<ngày>, KHÔNG vào git — repo chỉ giữ mục lục data/days.
name: collect

on:
  schedule:
    - cron: "10 8 * * 1-5"
    - cron: "30 8 * * 1-5"
    - cron: "0 10 * * 1-5"
    - cron: "0 13 * * 1-5"
    # 06:30 VN sáng T3–T7: lượt vét cuối cho phiên hôm trước (GitHub trễ lịch 5–6 giờ ngày 30/09/2026).
    - cron: "30 23 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "Gom lại cả mã đã có phiên (ghi đè)"
        default: "false"

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # ≈700 mã × ~0,5 s + trang 2+ của mã thanh khoản cao ≈ 8–12 phút lượt đầu; lượt bù vài phút.
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install httpx==0.28.1

      # Bài học price-path 23/09/2026: job trả 1 để BÁO "có mã lỗi" nhưng đã ghi xong dữ liệu. Thiếu
      # continue-on-error + các bước sau if: always() thì một mã lỗi làm mất trắng dữ liệu của các mã còn lại.
      - name: Gom tick
        id: collect
        continue-on-error: true
        run: |
          ARGS=
          if [ "${{ github.event.inputs.force }}" = "true" ]; then ARGS="--force"; fi
          python -m job.collect $ARGS

      - name: Đưa gói lên Release
        if: always() && steps.collect.outputs.changed == 'true'
        run: |
          DAY=${{ steps.collect.outputs.day }}
          F=data/rel/ticks-$DAY.tar
          if gh release view "t$DAY" >/dev/null 2>&1; then
            gh release upload "t$DAY" "$F" --clobber
          else
            gh release create "t$DAY" "$F" --title "Tick $DAY" --notes "Lệnh khớp gốc toàn thị trường phiên $DAY (VNDirect). Mục lục: data/days/$DAY.json"
          fi

      # Chỉ commit khi mục lục ngày đổi; state.json (có giờ chạy) đi kèm chứ không tự đẻ commit ở lượt dự phòng.
      - name: Commit mục lục
        if: always()
        run: |
          git config user.name "order-flow-live-bot"
          git config user.email "order-flow-live-bot@users.noreply.github.com"
          mkdir -p data/days
          git add -A data/days
          if git diff --cached --quiet; then echo "không có gì mới"; exit 0; fi
          git add data/state.json data/symbols.json
          git commit -m "data: $(TZ=Asia/Ho_Chi_Minh date +%F) [skip ci]"
          git pull --rebase
          git push

      # Commit xong RỒI mới báo đỏ. continue-on-error làm failure() không còn đúng → xét outcome của step đó.
      - name: Báo đỏ nếu có mã lỗi
        if: steps.collect.outcome == 'failure'
        run: |
          echo "::error::Có mã lỗi — xem data/state.json (lượt bù sau sẽ gom lại mã lỗi)"
          exit 1
